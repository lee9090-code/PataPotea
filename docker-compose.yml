version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: patapotea_db
    environment:
      POSTGRES_USER: patapotea
      POSTGRES_PASSWORD: patapotea
      POSTGRES_DB: patapotea_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: patapotea_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@patapotea.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
